# Keeps the free Supabase project from being paused for inactivity.
# Supabase pauses free projects that get too little database activity over 7
# days, and its docs say a few requests per day is typically enough. This runs
# once a day and makes three small read requests, spaced apart.
#
# Needs no secrets: the URL and publishable key are the same public values that
# are already in js/cloud.js. Scheduled workflows only run from the repo's
# DEFAULT branch (main), so this must be merged there to start working.
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 13 * * *'     # every day at 13:17 UTC
  workflow_dispatch: {}        # lets you run it by hand from the Actions tab

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read the keepalive table (3 requests)
        env:
          SUPABASE_URL: https://ewyndmpvqqhfnpwkucqf.supabase.co
          SUPABASE_KEY: sb_publishable_kUHTAuOP4wW9yVQ3IyMP9w_B5V4nQWA
        run: |
          for i in 1 2 3; do
            curl --fail --silent --show-error --retry 3 --retry-delay 5 \
              -H "apikey: $SUPABASE_KEY" \
              "$SUPABASE_URL/rest/v1/keepalive?select=id,note&limit=1"
            echo
            [ "$i" -lt 3 ] && sleep 30
          done
