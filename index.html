<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Code Bible">
<title>Code Bible</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">

  <header class="top">
    <p class="eyebrow">Daily reading companion</p>
    <h1 class="title">Code Bible</h1>
    <p class="subtitle">Every book, one chapter at a time</p>
  </header>

  <div class="modes">
    <button class="mode-btn" data-mode="game">Game mode</button>
    <button class="mode-btn" data-mode="read">Read mode</button>
    <button class="mode-btn" data-mode="bible">Bible mode</button>
  </div>

  <div class="view active" id="view-library">
    <div class="stats-row">
      <div class="stat"><div class="num" id="statDone">0 / 1189</div><div class="lbl">Chapters read</div></div>
      <div class="stat"><div class="num" id="statStreak">0</div><div class="lbl">Day streak</div></div>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <input class="search" id="bookSearch" placeholder="Search for a book&hellip;">
    <div id="bookList"></div>
  </div>

  <div class="view" id="view-chapters">
    <button class="back-btn" id="backToLibrary">&larr; All books</button>
    <h2 class="serif" id="chaptersBookTitle" style="font-size:22px; margin:4px 0 14px;"></h2>
    <div id="chapterList"></div>
  </div>

  <div class="view detail" id="view-detail">
    <button class="back-btn" id="backToChapters">&larr; <span id="backLabel"></span></button>
    <h2 id="detailTitle"></h2>
    <p class="meta" id="detailMeta"></p>
    <div id="detailBody"></div>
  </div>

</div>

<script src="js/data.js"></script>
<script src="js/storage.js"></script>
<script src="js/games.js"></script>
<script src="js/app.js"></script>
</body>
</html>
